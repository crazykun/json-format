name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

# 同一 PR 的新提交取消旧构建，省 Actions 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: 产物体检
        run: |
          set -euo pipefail
          echo "### 构建产物"
          echo '```'
          ls -la dist/ dist/assets/
          echo '```'
          echo ""
          echo "### gzip 后体积"
          echo '```'
          for f in dist/assets/*.js dist/assets/*.css dist/index.html; do
            [ -e "$f" ] || continue
            printf "%-52s %8s\n" "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.1fKB", $1/1024}')"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"